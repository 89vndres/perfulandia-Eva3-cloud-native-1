server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/perfulandia_db;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# RabbitMQ: configuración existente, se conserva sin reemplazar sus colas ni exchanges.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:perfulandia}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:perfulandia_dev_password}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
app.rabbitmq.exchange.ordenes=perfulandia.ordenes.exchange
app.rabbitmq.exchange.dlx=perfulandia.dlx
app.rabbitmq.queue.ordenes=perfulandia.ordenes.queue
app.rabbitmq.queue.ordenes.dlq=perfulandia.ordenes.dlq
app.rabbitmq.routing-key.ordenes=ordenes.creada
app.rabbitmq.routing-key.dlq=ordenes.fallida

# Kafka: dentro de Docker se usan los nombres DNS de los brokers.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

spring.kafka.consumer.group-id=${KAFKA_DEFAULT_GROUP:perfulandia-general}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.perfulandia.backend
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}

# Nombres y parámetros iniciales de los dos tópicos de la evaluación.
app.kafka.topics.ordenes=perfulandia.ordenes.eventos
app.kafka.topics.facturacion=perfulandia.facturacion.eventos
app.kafka.topics.partitions=3
app.kafka.topics.replicas=2
app.kafka.topics.retention-ms=604800000

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
# Keycloak IDaaS: backend valida la firma RSA del token mediante el JWKS del realm.
app.security.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/perfulandia}
app.security.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/perfulandia/protocol/openid-connect/certs}
